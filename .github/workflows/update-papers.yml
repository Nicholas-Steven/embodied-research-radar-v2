# 每日自动抓取论文 + AI 分析 + 提交数据
# 文档第二十四/二十五节：fetch -> normalize -> dedup -> filter -> rank -> AI summarize -> commit
# 同时支持 workflow_dispatch 手动触发
name: Update Papers

on:
  schedule:
    # 每天北京时间 08:00 (UTC 00:00)
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      init:
        description: "初始化大抓取"
        required: false
        default: "false"
      no_ai:
        description: "跳过 AI 分析"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LLM_PROVIDER: openai_compatible
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 初始化大抓取（可选）
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.init == 'true' }}
        run: python scripts/run_pipeline.py --init ${{ github.event.inputs.no_ai == 'true' && '--no-ai' || '' }}

      - name: 每日增量抓取
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.init == 'true') }}
        run: python scripts/run_pipeline.py ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.no_ai == 'true' && '--no-ai' || '' }}

      - name: 构建前端数据
        run: python scripts/build_data.py

      - name: 提交更新后的数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/ frontend/public/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): daily paper update $(date -u +%Y-%m-%d)"
            git push
          fi
