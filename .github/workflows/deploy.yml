# 构建 React 前端并部署到 GitHub Pages
# 目标：https://nicholas-steven.github.io/embodied-research-radar-v2/
# 文档第二十七节：project site 二级目录 base path 问题已在 vite.config.ts 处理
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm install

      - name: 生成前端静态数据
        run: python scripts/build_data.py

      - name: 类型检查
        working-directory: frontend
        run: npm run typecheck

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 上传 Pages 构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
