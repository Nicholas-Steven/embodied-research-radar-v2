# AI 分析模块配置
#
# Provider 抽象，支持 OpenAI 兼容协议（OpenAI、DeepSeek、ModelScope 等）。
# 通过环境变量读取 API Key，绝不写入代码或仓库。

ai:
  # 默认 provider；通过 LLM_PROVIDER 覆盖
  default_provider: "openai_compatible"

  providers:
    openai_compatible:
      # OpenAI 兼容协议：OpenAI / DeepSeek / ModelScope / Moonshot 等
      base_url_env: "LLM_BASE_URL"        # 例 https://api.deepseek.com/v1
      api_key_env: "LLM_API_KEY"
      model_env: "LLM_MODEL"              # 例 deepseek-chat
      default_model: "deepseek-chat"
      timeout_seconds: 60
      max_retries: 3

  # AI 分析开关：关闭时只更新元数据，将 AI 字段标记为 Pending
  enabled: true

  # 并发与节流
  concurrency: 2
  sleep_between_calls_seconds: 1

  # 输出可靠性：AI 不允许虚构的字段
  factual_fields_guard:
    - "doi"
    - "venue"
    - "code_url"
    - "authors"
    - "publication_status"
    - "experimental_numbers"
